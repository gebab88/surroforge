name: CI

# Tier-A invariant gates for SurroForge (see _bmad-output/planning-artifacts/architecture.md).
# Activates once this project is a git repo pushed to GitHub. Until then the
# locally-runnable equivalents are: `ruff check`, `mypy src`,
# `pyright --pythonpath .venv/bin/python` (config in [tool.pyright]), `lint-imports`,
# `pytest` (which includes tests/test_architecture.py), and the license scan below.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types + import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,dev]"
      - name: ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src
      - name: pyright
        # --pythonpath points at the CI job's interpreter (no .venv here); src only,
        # matching `mypy src` — the torch plugin needs its own deps, checked locally.
        run: pyright --pythonpath python src
      - name: import-linter (dependency-direction contracts)
        run: lint-imports

  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,dev]"
      - run: pytest -q

  reproducibility:
    name: reproducibility (pinned threads)
    runs-on: ubuntu-latest
    # Pin BLAS/OpenMP threads BEFORE the interpreter starts so numeric results are
    # deterministic — multi-threaded reductions reorder float summation (Spike 3).
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all,dev]"
      - name: reproducibility tests
        run: pytest -q tests/test_reproduce.py tests/test_canonicalize.py tests/test_reproduce_field.py tests/test_reproduce_scalar_identity.py tests/test_probe_coverage.py

  docs:
    name: docs build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[docs]"
      # --strict fails the build on a broken link, missing nav page, or any warning.
      - name: Build the documentation site
        run: mkdocs build --strict

  profile:
    name: profiling (CPU time is in compiled libs, not Core)
    runs-on: ubuntu-latest
    # Pin BLAS/OpenMP threads so the Kriging/RBF linear algebra is single-threaded
    # and the per-package tottime attribution is stable run-to-run.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # [all] brings smt, so the expensive O(n³) Kriging/RBF paths are profiled too.
      - run: pip install -e ".[all,dev]"
      # Asserts SurroForge's own code stays a small fraction of CPU time (the rest is
      # compiled libraries) — fails if a compute-bound hotspot lands in Core.
      - name: Profile run_training across methods (incl. SMT Kriging/RBF)
        run: python scripts/profile_training.py

  licenses:
    name: license hygiene (no GPL/LGPL in Core — NFR8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Scan the full installable surface (core + all optional backends).
      - run: pip install -e ".[all]" pip-licenses
      - name: Fail on any copyleft (GPL/LGPL/AGPL) dependency
        run: |
          pip-licenses --format=json > licenses.json
          python - <<'PY'
          import json, sys
          data = json.load(open("licenses.json"))
          bad = [d for d in data if "GPL" in d["License"].upper()]
          for d in bad:
              print(f"COPYLEFT: {d['Name']} {d['Version']} -> {d['License']}")
          sys.exit(1 if bad else 0)
          PY
