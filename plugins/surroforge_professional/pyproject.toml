[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surroforge_professional"
version = "0.2.0"
description = "Professional edition for SurroForge: licensed methods, HTML reports, DoE."
readme = { text = "Professional edition for SurroForge: licensed methods, HTML reports, DoE.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SurroForge" }]
keywords = ["surrogate", "surroforge", "reports", "html", "professional"]
dependencies = [
    "surroforge",
    "jinja2>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
doe = ["scipy>=1.15"]  # qmc engines are seeded via the SPEC-7 `rng=` parameter (scipy 1.15+)

[project.entry-points."surroforge.reporters"]
html = "surroforge_professional.reports.html:HtmlReporter"

[project.entry-points."surroforge.commands"]
doe = "surroforge_professional.commands.doe:doe_app"

[project.entry-points."surroforge.comparison_reporters"]
html = "surroforge_professional.reports.comparison:HtmlComparisonReporter"

[tool.hatch.build.targets.wheel]
packages = ["src/surroforge_professional"]

[tool.hatch.build.targets.wheel.force-include]
"src/surroforge_professional/reports/assets" = "surroforge_professional/reports/assets"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
