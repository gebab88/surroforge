[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surroforge-autoencoder"
version = "0.1.0"
description = "PyTorch autoencoder field surrogate plugin for SurroForge."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SurroForge" }]
keywords = ["surrogate", "autoencoder", "field-rom", "pytorch", "surroforge", "plugin"]
dependencies = [
    "surroforge",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[project.entry-points."surroforge.trainers"]
autoencoder-field = "surroforge_autoencoder.trainer:AutoencoderFieldTrainer"

[tool.hatch.build.targets.wheel]
packages = ["src/surroforge_autoencoder"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
